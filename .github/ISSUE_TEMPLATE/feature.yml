name: Feature request
description: Something Copper should do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. Copper stays small on purpose, so the problem matters more than the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not need to follow an individual visitor across days or sites.
          required: true
